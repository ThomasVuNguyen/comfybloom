<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>21st.dev Live Component Hub & Source Library - ComfyBloom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Prism.js for syntax highlighting -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
  <style>
    :root {
      --bg-dark: #07090e;
      --bg-card: #0e121b;
      --bg-card-hover: #141a27;
      --bg-code: #07090e;
      --border-color: #1b2334;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --accent-pink: #ec4899;
      --accent-cyan: #06b6d4;
      --accent-emerald: #10b981;
      --gradient-primary: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #ec4899 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      padding: 2rem;
      line-height: 1.5;
    }

    /* Header & Hero */
    header {
      max-width: 1400px;
      margin: 0 auto 2.5rem auto;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0) 100%);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 2.5rem;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    header::before {
      content: '';
      position: absolute;
      top: -100px;
      right: -100px;
      width: 300px;
      height: 300px;
      background: var(--gradient-primary);
      filter: blur(120px);
      opacity: 0.25;
      pointer-events: none;
      border-radius: 50%;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 0.75rem;
    }

    .brand-badge {
      background: var(--gradient-primary);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
      font-size: 1.8rem;
      letter-spacing: -0.02em;
    }

    .tag-21st {
      background: rgba(59, 130, 246, 0.15);
      color: var(--accent-blue);
      border: 1px solid rgba(59, 130, 246, 0.3);
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      max-width: 800px;
      margin-bottom: 2rem;
    }

    /* Metrics Bar */
    .metrics-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
    }

    .metric-card {
      background: rgba(14, 18, 27, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1rem 1.5rem;
      min-width: 160px;
    }

    .metric-value {
      font-size: 1.75rem;
      font-weight: 700;
      color: #fff;
    }

    .metric-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Controls Bar */
    .controls-bar {
      max-width: 1400px;
      margin: 0 auto 2rem auto;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 280px;
      max-width: 480px;
    }

    .search-input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.75rem 1rem 0.75rem 2.75rem;
      border-radius: 12px;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      width: 18px;
      height: 18px;
    }

    .filter-tabs {
      display: flex;
      background: var(--bg-card);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      gap: 4px;
    }

    .filter-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.5rem 1.25rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn:hover {
      color: var(--text-main);
    }

    .filter-btn.active {
      background: rgba(59, 130, 246, 0.2);
      color: #fff;
      border: 1px solid rgba(59, 130, 246, 0.4);
    }

    /* Grid Layout */
    .components-grid {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 1.75rem;
    }

    /* Component Card */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .card:hover {
      border-color: rgba(139, 92, 246, 0.4);
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.4);
    }

    .card-stage {
      width: 100%;
      min-height: 220px;
      background: #06080d;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      border-bottom: 1px solid var(--border-color);
      overflow: hidden;
    }

    .card-type-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      backdrop-filter: blur(8px);
      z-index: 20;
    }

    .card-type-badge.component {
      background: rgba(59, 130, 246, 0.85);
      color: #fff;
    }

    .card-type-badge.theme {
      background: rgba(236, 72, 153, 0.85);
      color: #fff;
    }

    .card-type-badge.hook {
      background: rgba(16, 185, 129, 0.85);
      color: #fff;
    }

    .card-id-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.65);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2px 8px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      z-index: 20;
    }

    .card-body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.25rem;
    }

    .card-author {
      font-size: 0.8rem;
      color: var(--accent-cyan);
      margin-bottom: 0.75rem;
      font-weight: 500;
    }

    .card-desc {
      font-size: 0.875rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 1.25rem;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Action Buttons */
    .card-actions {
      display: flex;
      gap: 0.75rem;
      margin-top: auto;
    }

    .btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--accent-blue);
      color: #fff;
    }

    .btn-primary:hover {
      background: #2563eb;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--text-muted);
    }

    /* Modal Drawer for Code */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: 100%;
      max-width: 1100px;
      height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    .modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.3);
    }

    .modal-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
    }

    .modal-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .modal-close:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    .modal-tabs {
      display: flex;
      background: #0c0f16;
      border-bottom: 1px solid var(--border-color);
      padding: 0 1.5rem;
      gap: 1rem;
    }

    .modal-tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.85rem 1rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }

    .modal-tab-btn.active {
      color: var(--accent-blue);
      border-bottom-color: var(--accent-blue);
    }

    .modal-code-area {
      flex: 1;
      background: var(--bg-code);
      overflow: auto;
      padding: 1.5rem;
      position: relative;
    }

    .copy-code-btn {
      position: absolute;
      top: 1rem;
      right: 1.5rem;
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #60a5fa;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      z-index: 10;
      transition: all 0.2s ease;
    }

    .copy-code-btn:hover {
      background: var(--accent-blue);
      color: #fff;
    }

    .copy-code-btn.copied {
      background: var(--accent-emerald);
      border-color: var(--accent-emerald);
      color: #fff;
    }

    pre[class*="language-"] {
      margin: 0;
      border-radius: 8px;
      background: transparent !important;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.875rem;
    }

    /* LIVE COMPONENT STYLES */
    .live-shimmer {
      background: linear-gradient(90deg, #64748b 0%, #ffffff 50%, #64748b 100%);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: liveShimmerAnim 2.5s infinite linear;
      font-weight: 800;
      font-size: 1.25rem;
    }
    @keyframes liveShimmerAnim {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .live-avatar-stack {
      display: flex;
      align-items: center;
    }
    .live-avatar-item {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 3px solid #0e121b;
      margin-left: -14px;
      object-fit: cover;
      transition: transform 0.2s ease;
      cursor: pointer;
    }
    .live-avatar-item:first-child {
      margin-left: 0;
    }
    .live-avatar-item:hover {
      transform: translateY(-6px) scale(1.15);
      z-index: 30;
    }

    .live-stepper {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .live-step {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #1e2638;
      color: #9ca3af;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .live-step.active {
      background: var(--accent-blue);
      color: #fff;
      box-shadow: 0 0 14px rgba(59, 130, 246, 0.6);
    }
    .live-step-line {
      width: 32px;
      height: 3px;
      background: var(--accent-blue);
      border-radius: 2px;
    }

    .live-folder-container {
      position: relative;
      width: 220px;
      height: 150px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .live-folder-card {
      position: absolute;
      width: 140px;
      height: 90px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      object-fit: cover;
    }
    .live-folder-container:hover .card-1 {
      transform: translateY(-35px) rotate(-12deg) scale(1.05);
    }
    .live-folder-container:hover .card-2 {
      transform: translateY(-40px) rotate(0deg) scale(1.1);
      z-index: 10;
    }
    .live-folder-container:hover .card-3 {
      transform: translateY(-35px) rotate(12deg) scale(1.05);
    }

    .live-product-hunt {
      background: #f3e3ac;
      border-radius: 12px;
      padding: 10px 18px;
      border: 1px solid #e2d192;
      color: #444;
      display: flex;
      align-items: center;
      gap: 14px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      transition: transform 0.3s ease;
      cursor: pointer;
    }
    .live-product-hunt:hover {
      transform: perspective(600px) rotateX(10deg) rotateY(-10deg) scale(1.05);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">
      <span class="brand-badge">21st.dev Live Components</span>
      <span class="tag-21st">ComfyBloom Workspace</span>
    </div>
    <p class="subtitle">Actual, functional, interactive HTML/CSS/DOM components rendered live on page. Every component below is executed directly inside your browser—no static preview images!</p>
    
    <div class="metrics-bar">
      <div class="metric-card">
        <div class="metric-value">27</div>
        <div class="metric-label">Total Bookmarks</div>
      </div>
      <div class="metric-card">
        <div class="metric-value">23</div>
        <div class="metric-label">Live UI Components</div>
      </div>
      <div class="metric-card">
        <div class="metric-value">2</div>
        <div class="metric-label">React Hooks</div>
      </div>
      <div class="metric-card">
        <div class="metric-value">2</div>
        <div class="metric-label">Themes</div>
      </div>
    </div>
  </header>

  <div class="controls-bar">
    <div class="search-box">
      <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
      <input type="text" id="search-input" class="search-input" placeholder="Search all 27 live components, hooks, authors, or code terms...">
    </div>

    <div class="filter-tabs">
      <button class="filter-btn active" data-filter="all">All (27)</button>
      <button class="filter-btn" data-filter="component">Components (23)</button>
      <button class="filter-btn" data-filter="hook">Hooks (2)</button>
      <button class="filter-btn" data-filter="theme">Themes (2)</button>
    </div>
  </div>

  <main class="components-grid" id="grid">
    <!-- Real live components populated here -->
  </main>

  <!-- Modal Drawer for Code -->
  <div class="modal-overlay" id="code-modal">
    <div class="modal-container">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">Component Code</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>

      <div class="modal-tabs">
        <button class="modal-tab-btn active" onclick="switchModalTab('source')">Component Source (TSX)</button>
        <button class="modal-tab-btn" onclick="switchModalTab('demo')">Demo Usage (TSX)</button>
        <button class="modal-tab-btn" onclick="switchModalTab('install')">Install Command</button>
      </div>

      <div class="modal-code-area">
        <button class="copy-code-btn" id="modal-copy-btn" onclick="copyCurrentModalCode()">Copy Code</button>
        <pre><code id="modal-code-content" class="language-tsx"></code></pre>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-jsx.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-typescript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-tsx.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>

  <script>
    const componentsData = [
      {
        id: "21203",
        name: "Ruixen Gradient Footer",
        type: "component",
        author: "ruixen.ui",
        desc: "A footer that shows content first, then stretches a tall, blurred rainbow gradient SVG up from the bottom.",
        install: "npx shadcn@latest add \"https://21st.dev/r/ruixen.ui/ruixen-gradient-footer\"",
        renderLive: () => `
          <div style="width:100%; height:100%; position:relative; background:#0a0d14; border-radius:12px; overflow:hidden; display:flex; flex-direction:column; justify-content:space-between; padding:1.25rem;">
            <div style="display:flex; justify-content:space-between; align-items:center; z-index:2;">
              <span style="font-weight:700; color:#fff; font-size:0.9rem;">✦ Lumen Studio</span>
              <span style="font-size:0.75rem; color:#9ca3af;">Overview · Docs · Pricing</span>
            </div>
            <div style="font-size:0.75rem; color:#6b7280; z-index:2;">© 2026 Lumen Studio. All systems normal.</div>
            <div style="position:absolute; bottom:0; left:0; right:0; height:60px; pointer-events:none; background:linear-gradient(180deg, rgba(3,88,247,0) 0%, rgba(3,88,247,0.6) 30%, rgba(255,212,0,0.8) 70%, rgba(253,2,245,0.9) 100%); filter:blur(14px); opacity:0.85;"></div>
          </div>
        `,
        sourceCode: `"use client";
import { useEffect, useId, useRef, useState } from "react";

export function RuixenGradientFooter({ children, gradientHeight = "65vh" }: any) {
  return (
    <footer style={{ paddingBottom: gradientHeight }}>
      {children}
      <div style={{ position: "fixed", left: 0, right: 0, bottom: 0, height: gradientHeight, pointerEvents: "none" }}>
        <svg viewBox="0 0 1271 599" fill="none">
          {/* Blurred Rainbow SVG Columns */}
        </svg>
      </div>
    </footer>
  );
}`,
        demoCode: `import { RuixenGradientFooter } from "@/components/ui/ruixen-gradient-footer";

export default function Demo() {
  return (
    <RuixenGradientFooter gradientHeight="40vh">
      <div>Lumen Studio Footer</div>
    </RuixenGradientFooter>
  );
}`
      },
      {
        id: "16368",
        name: "Interactive Folder Gallery",
        type: "component",
        author: "alexperezcedeno",
        desc: "A macOS-inspired folder that springs open on hover, fanning out photo cards with realistic physics.",
        install: "npx shadcn@latest add \"https://21st.dev/r/alexperezcedeno/interactive-folder-gallery\"",
        renderLive: () => `
          <div class="live-folder-container">
            <img class="live-folder-card card-1" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300&auto=format&fit=crop&q=80" />
            <img class="live-folder-card card-2" src="https://images.unsplash.com/photo-1604871000636-074fa5117945?w=300&auto=format&fit=crop&q=80" />
            <img class="live-folder-card card-3" src="https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=300&auto=format&fit=crop&q=80" />
            <div style="position:absolute; bottom:0; background:#1e1e1e; border:1px solid rgba(255,255,255,0.15); width:160px; height:45px; border-radius:10px; display:flex; align-items:center; justify-content:center; gap:8px; color:#fff; font-size:0.8rem; font-weight:600; box-shadow:0 10px 25px rgba(0,0,0,0.6); z-index:20;">
              📁 Photography.gallery
            </div>
          </div>
        `,
        sourceCode: `"use client";
import React, { useState } from "react";
import { motion } from "framer-motion";

        renderLive: (id) => `
          <div style="position:relative; width:100%; height:100%; background:#05070c; border-radius:12px; overflow:hidden;">
            <canvas id="stars-canvas-${id}" style="width:100%; height:100%; display:block;"></canvas>
            <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#60a5fa; font-family:monospace; font-weight:700; font-size:0.85rem; pointer-events:none;">
              ✨ Twinkling Pixel Stars ✨
            </div>
          </div>
        `,
        onMount: (id) => {
          const cvs = document.getElementById(`stars-canvas-${id}`);
          if (!cvs) return;
          const ctx = cvs.getContext('2d');
          let animId;
          const stars = Array.from({ length: 45 }).map(() => ({
            x: Math.random() * cvs.width,
            y: Math.random() * cvs.height,
            size: Math.random() > 0.8 ? 3 : 2,
            alpha: Math.random(),
            speed: 0.02 + Math.random() * 0.03
          }));
          function draw() {
            ctx.clearRect(0, 0, cvs.width, cvs.height);
            ctx.fillStyle = '#05070c';
            ctx.fillRect(0, 0, cvs.width, cvs.height);
            stars.forEach(s => {
              s.alpha += s.speed;
              if (s.alpha > 1 || s.alpha < 0.2) s.speed = -s.speed;
              ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(s.alpha)})`;
              ctx.fillRect(s.x, s.y, s.size, s.size);
            });
            animId = requestAnimationFrame(draw);
          }
          draw();
        },

          const img = document.getElementById(`hover-img-${id}`);

          const imgs = [
            "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400&auto=format&fit=crop&q=80",
            "https://images.unsplash.com/photo-1604871000636-074fa5117945?w=400&auto=format&fit=crop&q=80",

            const rect = container.getBoundingClientRect();
            const ratio = (e.clientX - rect.left) / rect.width;

            img.src = imgs[idx];
          });

            const x = Math.round(e.clientX - rect.left);
            const y = Math.round(e.clientY - rect.top);
            text.textContent = `Cursor: { x: ${x}, y: ${y} }`;
          });

    const grid = document.getElementById('grid');
    const searchInput = document.getElementById('search-input');
    const filterBtns = document.querySelectorAll('.filter-btn');

    let currentFilter = 'all';
    let searchQuery = '';

    function render() {
      const filtered = componentsData.filter(item => {
        const matchesFilter = currentFilter === 'all' || item.type === currentFilter;
        const matchesSearch = item.name.toLowerCase().includes(searchQuery) ||
          item.author.toLowerCase().includes(searchQuery) ||
          item.desc.toLowerCase().includes(searchQuery);

        return matchesFilter && matchesSearch;
      });

      grid.innerHTML = filtered.map(item => `
        <div class="card">
          <div class="card-stage">
            <span class="card-type-badge ${item.type}">${item.type}</span>
            <span class="card-id-badge">ID: ${item.id}</span>
            ${item.renderLive(item.id)}
          </div>
          <div class="card-body">
            <h2 class="card-title">${item.name}</h2>
            <div class="card-author">by @${item.author}</div>
            <p class="card-desc">${item.desc}</p>
            <div class="card-actions">
              <button class="btn btn-primary" onclick="openCodeModal('${item.id}')">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/>
                </svg>
                View Code
              </button>
              <button class="btn btn-secondary" onclick="copyInstall('${item.install.replace(/"/g, '&quot;')}', this)">
                Install
              </button>
            </div>
          </div>
        </div>
      `).join('');

      // Run onMount callbacks if present
      filtered.forEach(item => {
        if (item.onMount) {
          setTimeout(() => item.onMount(item.id), 50);
        }
      });
    }

    let activeModalItem = null;
    let activeModalTab = 'source';

    function openCodeModal(id) {
      activeModalItem = componentsData.find(i => i.id === id);
      if (!activeModalItem) return;
      
      document.getElementById('modal-title').textContent = activeModalItem.name + ' Code';
      switchModalTab('source');
      document.getElementById('code-modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('code-modal').classList.remove('active');
    }

    function switchModalTab(tab) {
      activeModalTab = tab;
      const tabBtns = document.querySelectorAll('.modal-tab-btn');
      tabBtns[0].classList.toggle('active', tab === 'source');
      tabBtns[1].classList.toggle('active', tab === 'demo');
      tabBtns[2].classList.toggle('active', tab === 'install');

      const codeContent = document.getElementById('modal-code-content');
      if (tab === 'source') {
        codeContent.textContent = activeModalItem.sourceCode || '// Component source code';
        codeContent.className = 'language-tsx';
      } else if (tab === 'demo') {
        codeContent.textContent = activeModalItem.demoCode || '// Demo usage code';
        codeContent.className = 'language-tsx';
      } else {
        codeContent.textContent = activeModalItem.install || '';
        codeContent.className = 'language-bash';
      }

      Prism.highlightElement(codeContent);
    }

    function copyCurrentModalCode() {
      const codeContent = document.getElementById('modal-code-content').textContent;
      navigator.clipboard.writeText(codeContent).then(() => {
        const btn = document.getElementById('modal-copy-btn');
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'Copy Code';
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    function copyInstall(cmd, btn) {
      navigator.clipboard.writeText(cmd).then(() => {
        const orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = orig; }, 1500);
      });
    }

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      render();
    });

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        render();
      });
    });

    render();
  </script>
