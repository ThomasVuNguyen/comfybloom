[project]
name = "comfybloom-onshape-mcp"
version = "1.2.0"
description = "ComfyBloom Beefed-Up Onshape MCP Server — Full Parametric CAD, FeatureScript Escape Hatch, Multi-view Vision Rendering, Entity Discovery & Hints"
authors = [
    {name = "ComfyBloom Engineering"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "starlette>=0.27.0",
    "uvicorn>=0.23.0",
    "loguru>=0.7.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "coverage[toml]>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"onshape_mcp/server.py" = ["E402"]

[tool.hatch.build.targets.wheel]
packages = ["onshape_mcp"]

[project.scripts]
onshape-mcp = "onshape_mcp.server:main"

